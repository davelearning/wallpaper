default_stages: [pre-commit]
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.3
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/jorisroovers/gitlint
  rev:  v0.19.1
  hooks:
    - id: gitlint
